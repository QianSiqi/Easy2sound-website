# Easy2Sound 日本镜像站 — Nginx 配置（方案 A：静态前端 + 反代主站 API）
#
# 用法：
#   cp nginx-mirror.conf /etc/nginx/sites-available/easy2sound-mirror
#   ln -s /etc/nginx/sites-available/easy2sound-mirror /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   （或用 setup-mirror.sh 一键完成，脚本会自动替换下面三个占位值）
#
# ===== 手动修改三处（如用 setup-mirror.sh 则无需改） =====
#   ① server_name  → 你的镜像站域名（先做好 DNS A 记录指向本机）
#   ② root         → 前端文件目录
#   ③ proxy_pass   → 主站地址

server {
    listen 80;
    server_name mirror.easy2sound.xyz;          # ① 镜像站域名

    root /var/www/easy2sound;                   # ② 前端文件目录
    index index.html;
    # SPA：找不到文件时回退到 index.html
    try_files $uri $uri/ /index.html;

    # 静态资源缓存：图片/安装包可长缓存；js/css 不缓存（避免更新后浏览器还在用旧代码）
    location ~* \.(jpg|jpeg|png|bmp|svg|ico|exe|zip)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # 反代 API 到主站（保持 /api 前缀，由主站 nginx 再剥离）
    location /api/ {
        proxy_pass https://www.easy2sound.xyz;  # ③ 主站地址（必须 https：主站 http 会 301 跳转，nginx 不跟随）
        proxy_set_header Host www.easy2sound.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 反代头像目录到主站
    location /uploads/ {
        proxy_pass https://www.easy2sound.xyz;  # ③ 主站地址
        proxy_set_header Host www.easy2sound.xyz;
    }
}
