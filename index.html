<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy2Sound - 虚拟歌姬声学合成器</title>
    <link rel="icon" type="image/jpeg" href="图标.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
</head>
<body>

<!-- 双层流体光标 -->
<div id="cursorDot"></div>
<div id="cursorRing"></div>

<!-- 顶部纤细进度指示器 -->
<div id="pageLaserBeam"></div>

<!-- 3D 动态声波粒子 Canvas -->
<canvas id="cyberWaveCanvas"></canvas>

<!-- 空灵星际漫射光斑 -->
<div class="ambient-glow-orb orb-1"></div>
<div class="ambient-glow-orb orb-2"></div>

<!-- 全局 Toast 通知容器 -->
<div id="toastContainer"></div>

<!-- 精密控制台顶栏 (Ethereal Ribbon Nav) -->
<header class="nav-container">
    <div class="nav-inner">
        <!-- 品牌区域 -->
        <a href="#home" class="brand-link">
            <img src="图标.jpg" alt="Easy2Sound" class="brand-logo">
            <span class="brand-title">
                <span>Easy2Sound</span>
                <span class="brand-badge-tag">STUDIO</span>
            </span>
        </a>

        <!-- 导航菜单 -->
        <nav class="nav-links" id="navLinks">
            <a href="#home" data-page="home" class="active">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>主页</span>
            </a>
            <a href="#download" data-page="download">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>下载</span>
            </a>
            <a href="#voicebank" data-page="voicebank">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <span>声库</span>
            </a>
            <a href="#feedback" data-page="feedback">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>反馈</span>
            </a>
            <a href="#team" data-page="team">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>制作组</span>
            </a>
            <a href="#donate" data-page="donate">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span>投喂</span>
            </a>
            <a href="#source" data-page="source">
                <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                <span>源码</span>
            </a>
            <a href="#admin" data-page="admin" id="navAdmin" style="display:none;">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>管理</span>
            </a>
        </nav>

        <!-- 移动端汉堡切换按钮 -->
        <button class="mobile-toggle" id="mobileToggle" aria-label="切换菜单">
            <svg class="icon-svg" viewBox="0 0 24 24" style="width:20px;height:20px;"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <!-- 右侧用户状态区域 -->
        <div class="user-info" id="userInfo"></div>
    </div>
</header>

<!-- ========== 登录 / 注册弹窗 ========== -->
<div class="login-modal" id="loginModal">
    <div class="modal-container">
        <button class="close-modal" id="closeModal" aria-label="关闭">
            <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="tabs">
            <div class="tab active" data-tab="login">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                <span>登录</span>
            </div>
            <div class="tab" data-tab="register">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                <span>注册</span>
            </div>
        </div>

        <!-- 登录表单 -->
        <div class="form-section active" id="login">
            <div class="form-group">
                <label for="login-username">用户名</label>
                <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <div class="form-group" id="captchaBox" style="display:none;margin-bottom:16px;"></div>
            <button class="form-btn" id="login-btn">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                <span>登 录</span>
            </button>
            <div class="message" id="login-message"></div>
        </div>

        <!-- 注册表单 -->
        <div class="form-section" id="register">
            <div class="form-group">
                <label for="reg-username">用户名</label>
                <input type="text" id="reg-username" placeholder="请设置用户名（2-20字符）" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="reg-email">邮箱</label>
                <div style="display:flex;gap:8px;">
                    <input type="email" id="reg-email" placeholder="请输入邮箱地址" style="flex:1;" autocomplete="email">
                    <button class="btn-ghost-glow" id="reg-send-code" style="flex-shrink:0;padding:0 12px;font-size:12px;" onclick="sendRegisterCode()">
                        <span>获取验证码</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-code">邮箱验证码</label>
                <input type="text" id="reg-code" placeholder="请输入 6 位数字验证码" maxlength="6" inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="reg-qq">QQ 号（自动生成头像，选填）</label>
                <input type="number" id="reg-qq" placeholder="输入后自动同步QQ头像">
            </div>
            <div class="form-group">
                <label for="reg-password">密码</label>
                <input type="password" id="reg-password" placeholder="请设置密码（至少 6 位）" autocomplete="new-password">
            </div>
            <button class="form-btn" id="register-btn">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                <span>注 册</span>
            </button>
            <div class="message" id="register-message"></div>
        </div>
    </div>
</div>

<!-- ========== 头像设置弹窗 ========== -->
<div class="avatar-setting-modal" id="avatarSettingModal">
    <div class="avatar-setting-container">
        <button class="close-modal" id="closeAvatarModal" aria-label="关闭">
            <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <h3 style="text-align:center;color:#fff;margin-bottom:14px;font-size:1.15rem;">头像与资料设置</h3>
        <div class="avatar-preview">
            <img class="avatar-preview-img" id="avatarPreviewImg" alt="头像预览">
        </div>
        
        <div class="upload-box" id="uploadBox">
            <div class="upload-text">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>点击上传本地图片 (JPG / PNG ≤ 2MB)</span>
            </div>
            <input type="file" id="avatarFile" accept="image/jpeg,image/png">
        </div>
        <div class="form-group">
            <label for="setting-qq">QQ 号码</label>
            <input type="number" id="setting-qq" placeholder="输入 QQ 号自动同步头像">
        </div>
        <div class="form-group">
            <label for="setting-avatar-url">自定义头像链接</label>
            <input type="text" id="setting-avatar-url" placeholder="https://...">
        </div>
        <button class="form-btn" id="saveAvatarBtn">
            <span>保存设置</span>
        </button>
        <div class="message" id="avatar-message"></div>
    </div>
</div>

<!-- ========== 声库详情弹窗 ========== -->
<div class="vb-modal" id="vbModal">
    <div class="vb-modal-box">
        <button class="close-modal" onclick="closeVBModal()" aria-label="关闭">
            <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <img class="vb-modal-img" id="vbModalImg" src="" alt="声库封面">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;">
            <span class="vb-modal-title" id="vbModalTitle"></span>
            <span class="vb-tag" id="vbModalTag"></span>
        </div>
        <p class="vb-modal-desc" id="vbModalDesc"></p>
        
        <div id="vbDemoWrap" style="display:none;">
            <div class="vb-demo-label">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <span>Demo 试听</span>
            </div>
            <audio class="vb-audio-player" id="vbDemoPlayer" controls></audio>
        </div>
        <div id="vbVideoWrap" style="display:none;margin-top:14px;">
            <div class="vb-demo-label">
                <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                <span>演示视频</span>
            </div>
            <div class="video-embed">
                <iframe id="vbVideoFrame" src="" scrolling="no" allowfullscreen="true" sandbox="allow-top-navigation allow-same-origin allow-scripts allow-popups"></iframe>
            </div>
        </div>
    </div>
</div>

<!-- ========== 用户画像弹窗 ========== -->
<div class="login-modal" id="userInfoModal">
    <div class="modal-container" style="text-align:center;max-width:360px;">
        <button class="close-modal" id="closeUserInfoModal" aria-label="关闭">
            <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="avatar-preview" style="margin-top:4px;">
            <img class="avatar-preview-img" id="userInfoAvatar" src="" alt="用户头像">
        </div>
        <h3 style="color:#fff;margin:10px 0 4px;font-size:1.15rem;" id="userInfoName">-</h3>
        <div id="userInfoBadges" style="margin-bottom:14px;"></div>
        <div style="background:rgba(255,255,255,0.03);border-radius:6px;padding:12px 16px;text-align:left;font-size:12px;color:rgba(255,255,255,0.7);line-height:2;border:var(--hairline);">
            <p><strong>UID：</strong><span id="userInfoUid" style="color:#fff;">-</span></p>
            <p><strong>注册时间：</strong><span id="userInfoCreated" style="color:#fff;">-</span></p>
            <p><strong>QQ：</strong><span id="userInfoQq" style="color:#fff;">-</span></p>
        </div>
    </div>
</div>

<!-- ========== SPA 内容挂载主容器 ========== -->
<main id="app"></main>

<script src="index.js"></script>
</body>
</html>
