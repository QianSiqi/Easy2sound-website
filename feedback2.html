<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>备用反馈页 | Easy2Sound</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="图标.jpg">

<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
    <main class="glass-card spotlight-card stagger-1" style="max-width:520px;text-align:center;padding:48px 28px;">
        <div class="icon-badge" style="width:52px;height:52px;margin:0 auto 16px;border-radius:14px;">

        </div>
        <h1 style="font-size:1.6rem;margin-bottom:10px;justify-content:center;">备用问题反馈区</h1>
        <p style="color:var(--text-secondary);font-size:13.5px;line-height:1.6;margin-bottom:26px;">
            如果您的浏览器禁用或无法加载 JavaScript，请直接在主反馈页正常提交或联系技术团队。
        </p>
        <a href="index.html#feedback" class="btn btn-primary" style="padding:11px 28px;">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
