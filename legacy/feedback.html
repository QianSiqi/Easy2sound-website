<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy2Sound - 反馈问题</title>
    <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/jpeg" href="图标.jpg">
        <style>
                    /* 卡片错开入场 */
        .stagger-1 { animation: cardIn 0.45s ease both; }
        .stagger-2 { animation: cardIn 0.45s 0.08s ease both; }
        .stagger-3 { animation: cardIn 0.45s 0.16s ease both; }
        .stagger-4 { animation: cardIn 0.45s 0.24s ease both; }
        .stagger-5 { animation: cardIn 0.45s 0.32s ease both; }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        </style>
</head>
<body>

<!-- 导航栏 -->
<div class="nav-container">
    <div class="nav">
        <a href="index.html" id="nav1">主页</a>
        <a href="download.html" id="nav2">下载</a>
        <a href="voicebank.html" id="nav3">声库</a>
        <a href="feedback.html" id="nav4" class="active">反馈问题</a>
        <a href="team.html" id="nav5">制作组名单</a>
        <a href="donation.html" id="nav6">投喂</a>
        <a href="source.html" id="nav7">源代码</a>
    </div>
    <div class="user-info" id="userInfo"></div>
</div>

<!-- 反馈表单 -->
<div class="glass-card stagger-1">
    <h1>意见反馈</h1>
    <p style="margin-bottom:24px;">您的宝贵意见将帮助我们改进 Easy2Sound</p>

    <div style="display:flex; gap:12px; margin-bottom:16px;">
        <input type="text" class="feedback-input" placeholder="请输入您的宝贵意见..." style="flex:1;">
        <button class="submit-btn btn btn-primary" style="min-width:120px;">提交反馈</button>
    </div>

    <div style="background:rgba(255,255,255,0.05); border-radius:12px; padding:16px 20px;">
        <p style="color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:4px;">💡 提示</p>
        <p style="color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:4px;">1. 您的意见将存储在 JSONBin 云端</p>
        <p style="color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:4px;">2. 请尽量详细描述问题</p>
        <p style="color:rgba(255,255,255,0.5); font-size:13px;">3. 我们会定期查看</p>
    </div>
    <p>如果无法使用JavaScript，请访问<a href="feedback2.html" style="color: #66ccff;">备用反馈页</a>
</div>

<!-- 历史反馈列表 -->
<div class="glass-card stagger-2">
    <h1>历史反馈</h1>
    <div id="feedbackListContainer">
        <div style="text-align:center; color:rgba(255,255,255,0.5); padding:20px;">正在加载历史反馈...</div>
    </div>
</div>

<!-- 登录弹窗 -->
<div class="login-modal" id="loginModal">
    <div class="modal-container">
        <button class="close-modal" id="closeModal">&times;</button>
        <div class="tabs">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>
        <div class="form-section active" id="login">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="login-username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-password" placeholder="请输入密码">
            </div>
            <button class="form-btn" id="login-btn">登录</button>
            <div class="message" id="login-message"></div>
        </div>
        <div class="form-section" id="register">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="reg-username" placeholder="请设置用户名">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="reg-email" placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label>QQ号（自动生成头像）</label>
                <input type="number" id="reg-qq" placeholder="选填，输入后自动获取QQ头像">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="reg-password" placeholder="请设置密码">
            </div>
            <button class="form-btn" id="register-btn">注册</button>
            <div class="message" id="register-message"></div>
        </div>
    </div>
</div>

<!-- 头像设置弹窗 -->
<div class="avatar-setting-modal" id="avatarSettingModal">
    <div class="avatar-setting-container">
        <button class="close-modal" id="closeAvatarModal">&times;</button>
        <h3 style="text-align:center; color:#fff; margin-bottom:20px; font-size:1.2rem;">设置头像</h3>
        <div class="avatar-preview">
            <img class="avatar-preview-img" id="avatarPreviewImg">
        </div>
        <p class="avatar-tips">选择以下方式设置头像（优先使用上传的头像）</p>
        <div class="upload-box" id="uploadBox">
            <p class="upload-text">点击上传本地头像（支持jpg/png格式）</p>
            <input type="file" id="avatarFile" accept="image/jpeg,image/png">
        </div>
        <div class="form-group">
            <label>QQ号（自动生成头像）</label>
            <input type="number" id="setting-qq" placeholder="输入QQ号自动生成头像">
        </div>
        <div class="form-group">
            <label>自定义头像URL</label>
            <input type="text" id="setting-avatar-url" placeholder="输入头像图片链接（上传后自动填充）">
        </div>
        <button class="form-btn" id="saveAvatarBtn">保存</button>
        <div class="message" id="avatar-message"></div>
    </div>
</div>

<script>
// ========== 反馈功能 ==========
function formatDateTime(timestamp) {
    if (typeof timestamp === 'object') {
        const y = timestamp.getFullYear();
        const m = String(timestamp.getMonth() + 1).padStart(2, '0');
        const d = String(timestamp.getDate()).padStart(2, '0');
        const h = String(timestamp.getHours()).padStart(2, '0');
        const i = String(timestamp.getMinutes()).padStart(2, '0');
        const s = String(timestamp.getSeconds()).padStart(2, '0');
        return `${y}-${m}-${d} ${h}:${i}:${s}`;
    }
    if (timestamp.length !== 14) return timestamp;
    return `${timestamp.slice(0,4)}-${timestamp.slice(4,6)}-${timestamp.slice(6,8)} ${timestamp.slice(8,10)}:${timestamp.slice(10,12)}:${timestamp.slice(12,14)}`;
}

async function loadFeedbackList() {
    const container = document.getElementById('feedbackListContainer');
    try {
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            method: 'GET',
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const getData = await getRes.json();
        const feedbacks = getData.record.feedbacks || [];

        if (feedbacks.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.5); padding:20px;">暂无反馈内容</div>';
            return;
        }

        let html = '';
        feedbacks.reverse().forEach(item => {
            html += `
                <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:18px; margin-bottom:14px; transition:all 0.3s;">
                    <div style="color:rgba(255,255,255,0.4); font-size:12px; margin-bottom:8px;">提交时间：${formatDateTime(item.timestamp)}</div>
                    <div style="color:rgba(255,255,255,0.85); font-size:15px; line-height:1.6;">${item.content}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = `<div style="text-align:center; color:rgba(255,255,255,0.5); padding:20px;">加载失败：${e.message}</div>`;
    }
}

async function submitFeedback() {
    const input = document.querySelector('.feedback-input');
    const btn = document.querySelector('.submit-btn');
    const text = input.value.trim();
    if (!text) { alert('请输入反馈内容！'); return; }

    btn.disabled = true;
    btn.textContent = '提交中...';

    try {
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            method: 'GET',
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const getData = await getRes.json();
        const currentFeedbacks = getData.record.feedbacks || [];

        const now = new Date();
        const newFeedback = {
            timestamp: formatDateTime(now).replace(/[-: ]/g, ''),
            content: text,
            userAgent: navigator.userAgent
        };
        const updatedFeedbacks = [...currentFeedbacks, newFeedback];

        const updateRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify({ feedbacks: updatedFeedbacks })
        });

        if (!updateRes.ok) throw new Error('存储失败');

        alert('反馈提交成功！');
        input.value = '';
        loadFeedbackList();
    } catch (e) {
        alert('提交失败：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '提交反馈';
    }
}
</script>
<script src="loginRegister.js"></script>
</body>
</html>
